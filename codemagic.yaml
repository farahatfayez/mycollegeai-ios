workflows:
  ios-release:
    name: MY COLLEGE AI - iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycollegeai.app
      vars:
        BUNDLE_ID: "com.mycollegeai.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6779775019"
      node: v20.18.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Rebuild iOS platform
        script: |
          # Remove incomplete ios folder and recreate from scratch
          rm -rf ios
          npx cap add ios

      - name: Build web assets
        script: |
          npm run build || echo "No build script, creating empty dist..."
          mkdir -p dist
          echo "<html><body>MY COLLEGE AI</body></html>" > dist/index.html

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios --no-build

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST + 1))

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - farahatfayez@gmail.com
        notify:
          success: true
          failure: true
