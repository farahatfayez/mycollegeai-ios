workflows:
  ios-release:
    name: MY COLLEGE AI - iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycollegeai.app
      vars:
        BUNDLE_ID: "com.mycollegeai.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6779775019"
      node: v20.18.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Rebuild iOS platform
        script: |
          # Backup custom Info.plist before rebuilding iOS platform
          if [ -f ios/App/App/Info.plist ]; then
            cp ios/App/App/Info.plist /tmp/Info.plist.backup
            echo "✅ Info.plist backed up"
          fi
          # Remove and recreate iOS platform
          rm -rf ios
          npx cap add ios
          echo "✅ iOS platform recreated"

      - name: Restore custom Info.plist
        script: |
          # Restore our custom Info.plist with all Privacy keys
          if [ -f /tmp/Info.plist.backup ]; then
            cp /tmp/Info.plist.backup ios/App/App/Info.plist
            echo "✅ Custom Info.plist restored with all Privacy keys"
          else
            echo "⚠️ No backup found, using default Info.plist"
          fi

      - name: Build web assets
        script: |
          npm run build 2>/dev/null || true
          # Ensure dist folder exists with minimal content
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo "<html><head><title>MY COLLEGE AI</title></head><body></body></html>" > dist/index.html
          fi

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST + 1))

      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - farahatfayez@gmail.com
        notify:
          success: true
          failure: true
